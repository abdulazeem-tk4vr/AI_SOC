<!--
  Lab Wazuh agent — enrolls to wazuh-manager, tails injection-test.log for demos.
  Manager address is substituted at container start from WAZUH_MANAGER.
-->
<ossec_config>
  <client>
    <server>
      <address>WAZUH_MANAGER_PLACEHOLDER</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <config-profile>ubuntu,ubuntu22,ubuntu22.04</config-profile>
    <notify_time>10</notify_time>
    <time-reconnect>60</time-reconnect>
    <auto_restart>yes</auto_restart>
    <crypto_method>aes</crypto_method>
  </client>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/injection-test.log</location>
  </localfile>

  <logging>
    <log_format>plain</log_format>
  </logging>
</ossec_config>
