# Wazuh lab agents (4.8.2) — use with phase1 SIEM compose on the same project/network.
#
#   docker compose -p ai-soc-siem -f docker-compose/phase1-siem-core-windows.yml \
#     -f docker-compose/wazuh-agents.yml up -d --build
#
# Inject a log line on the web agent:
#   ./scripts/wazuh-agent-inject.sh "Failed password for invalid user root from 203.0.113.42 port 22 ssh2"

x-wazuh-agent: &wazuh-agent
  build:
    context: ../config/wazuh-agent
    dockerfile: Dockerfile
    args:
      WAZUH_VERSION: ${WAZUH_AGENT_VERSION:-4.8.2}
  image: ai-soc/wazuh-agent:${WAZUH_AGENT_VERSION:-4.8.2}
  restart: unless-stopped
  networks:
    - siem-backend
  depends_on:
    wazuh-manager:
      condition: service_healthy
  environment:
    WAZUH_MANAGER: wazuh-manager
  volumes:
    - ../config/wazuh-agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
  healthcheck:
    test: ["CMD-SHELL", "/var/ossec/bin/wazuh-control status 2>/dev/null | grep -q 'wazuh-agentd is running'"]
    interval: 30s
    timeout: 10s
    retries: 10
    start_period: 120s
  deploy:
    resources:
      limits:
        memory: 512M
        cpus: "0.5"

services:
  wazuh-agent-web:
    <<: *wazuh-agent
    container_name: wazuh-agent-web
    hostname: web-server-01
    environment:
      WAZUH_MANAGER: wazuh-manager
      WAZUH_AGENT_NAME: web-server-01
    volumes:
      - ../config/wazuh-agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - wazuh-agent-web-etc:/var/ossec/etc
      - wazuh-agent-web-log:/var/log

  wazuh-agent-app:
    <<: *wazuh-agent
    container_name: wazuh-agent-app
    hostname: app-server-02
    environment:
      WAZUH_MANAGER: wazuh-manager
      WAZUH_AGENT_NAME: app-server-02
    volumes:
      - ../config/wazuh-agent/ossec.conf:/wazuh-config-mount/etc/ossec.conf:ro
      - wazuh-agent-app-etc:/var/ossec/etc
      - wazuh-agent-app-log:/var/log

volumes:
  wazuh-agent-web-etc:
  wazuh-agent-web-log:
  wazuh-agent-app-etc:
  wazuh-agent-app-log:
